        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(160deg, var(--c1), var(--c2));
            transition: background .5s

        #bg::before,
        #bg::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
            animation: float 9s ease-in-out infinite alternate
        }

        #bg::before {
            width: 40vmax;
            height: 40vmax;
            left: -12vmax;
            top: -12vmax

        #bg::after {
            width: 34vmax;
            height: 34vmax;
            right: -10vmax;
            bottom: -10vmax;

            to {

            }

        .zan {

        .zn {

            font-weight: 800
        }

        .endbox {
            flex: 1;
            min-height: 0;
            background: #fff;
            border-radius: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;

        .row2 {

        #fx {

        .conf {
            position: fixed;

        }

        @keyframes fly {

            }
        }

        @media (max-aspect-ratio:5/4) {
            .zones.cols.n3 {

        @media (min-aspect-ratio:5/4) {
